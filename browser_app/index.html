<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CVNN Browser App</title>
    <style>
        .image-container {
            position: relative;
            width: 100%;
            margin-bottom: 1rem;
            display: none; /* Controlled entirely via JS on #image-wrapper */
        }

        #test-image {
            width: 100%;
            height: auto;
        }

        #output-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Lets mouse clicks pass through to image if needed */
        }

        .camera-container {
            width: 100%;
            max-width: 800px;
            margin-bottom: 1rem;
        }

        #camera-video {
            display: block;
            width: 100%;
            height: auto;
            background: #000;
        }

        .camera-controls {
            margin-top: 0.75rem;
        }

        .camera-controls button {
            margin-right: 0.5rem;
        }
    </style>
</head>

<body>
    <main>
        <h1>CVNN Browser App</h1>

        <p id="status">Starting application...</p>

        <section>
            <h2>Environment</h2>
            <dl>
                <dt>Browser</dt>
                <dd id="browser-status">Checking...</dd>

                <dt>Application</dt>
                <dd id="application-status">Checking...</dd>

                <dt>Model asset</dt>
                <dd id="model-status">Not loaded</dd>
            </dl>
        </section>

        <!-- Inference test, image upload, canvas overlay (bbox rendering) -->
        <section>
            <h2>Inference Test</h2>

            <div style="margin-bottom: 1rem;">
                <label for="image-input">Select JPEG Image: </label>
                <input type="file" id="image-input" accept=".jpg,.jpeg,image/jpeg" />
            </div>

            <div id="image-wrapper" class="image-container">
                <img id="test-image" alt="Selected image preview" />
                <canvas id="output-canvas"></canvas>
            </div>

            <button id="run-btn" disabled>Run Inference</button>

            <h3>Detections Output</h3>
            <pre id="output-box">Awaiting inference execution...</pre>
        </section>

        <!-- Webcam section (first test) -->
        <h2>Webcam renderer (first version)</h2>
        <div class="camera-container">
            <video id="camera-video" autoplay playsinline></video>
        </div>

        <div class="camera-controls">
            <button id="camera-start-btn">Start Camera</button>
            <button id="camera-stop-btn" disabled>Stop Camera</button>
        </div>

        <dl>
            <dt>Camera status</dt>
            <dd id="camera-status">Camera not started</dd>

            <dt>Camera FPS</dt>
            <dd id="camera-fps">—</dd>
        </dl>

    </main>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
